name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests (TopologyTestDriver + integración con Kafka en Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
      - name: Resumen de tests
        if: always()
        run: |
          echo "### Tests" >> $GITHUB_STEP_SUMMARY
          grep -h "<testsuite " */target/*-reports/*.xml | sed -E 's/.* name="([^"]+)".*tests="([0-9]+)".*errors="([0-9]+)".*skipped="([0-9]+)".*failures="([0-9]+)".*/- \1: \2 tests, \3 errors, \4 skipped, \5 failures/' >> $GITHUB_STEP_SUMMARY

  docker:
    name: Imágenes Docker y arranque de punta a punta
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach
      - name: Espera a que el pipeline detecte fraude de verdad
        run: |
          for i in $(seq 1 60); do
            alerts=$(curl -sf http://localhost:8080/api/stats | jq -r '.alerts // 0' || echo 0)
            echo "Intento $i: $alerts alertas"
            if [ "$alerts" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Logs si falla
        if: failure()
        run: docker compose logs --tail=100
