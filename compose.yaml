# docker compose up --build   → panel en http://localhost:8080
services:
  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "29092:29092" # para herramientas y para ejecutar los servicios desde el IDE
    environment:
      # KRaft: el propio broker hace de controlador, sin ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Un solo broker: los tópicos internos no pueden tener más réplicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos se declaran en el código: nada de crearlos sin querer con una sola partición.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 6
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  processor:
    build:
      context: .
      args:
        MODULE: processor
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_STREAMS_STATE_DIR: /app/state
    volumes:
      - streams-state:/app/state
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build:
      context: .
      args:
        MODULE: producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GENERATOR_TPS: ${GENERATOR_TPS:-15}
      GENERATOR_ATTACK_EVERY: ${GENERATOR_ATTACK_EVERY:-20s}
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  streams-state:
